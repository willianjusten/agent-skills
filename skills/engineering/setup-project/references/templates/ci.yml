# Runs the same verify command agents run locally, on every push and pull request.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm only: - uses: pnpm/action-setup@v4
      # bun only: - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: <.nvmrc | .node-version | package.json>
          cache: <npm | pnpm | yarn; remove for bun>
      - run: <npm ci | pnpm install --frozen-lockfile | yarn install --immutable | bun install --frozen-lockfile>
      - run: <pm> run verify
