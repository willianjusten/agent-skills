<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">The creative loop</title>
  <desc id="d">You settle the idea with ideation and brief. Then creative-loop scaffolds a run branch and loop log, and runs the inner loop: edit, shot, look, check, commit. The Stop hook is the outer loop: while budget is left it hands back the next direction. When the budget is spent, hand-off sends the video, contact sheet and summary.</desc>
  <style>
    .card{fill:#F6F8FA;stroke:#D1D9E0}
    .surface{fill:#FFFFFF}
    .ink{fill:#1F2328}
    .muted{fill:#59636E}
    .blue{stroke:#0969DA}
    .green{stroke:#1A7F37}
    .inkstroke{stroke:#1F2328}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .name{font-size:15px;font-weight:600}
    .sub{font-size:12.5px}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .card{fill:#151B23;stroke:#3D444D}
      .surface{fill:#0D1117}
      .ink{fill:#F0F6FC}
      .muted{fill:#9198A1}
      .blue{stroke:#4493F8}
      .green{stroke:#3FB950}
      .inkstroke{stroke:#F0F6FC}
    }
  </style>
  <rect class="card" x="1" y="1" width="958" height="358" rx="14"/>

  <line class="blue" x1="30" y1="34" x2="58" y2="34" stroke-width="6" stroke-linecap="round"/>
  <text class="ink sub" x="66" y="38">You: approve</text>
  <line class="green" x1="190" y1="34" x2="218" y2="34" stroke-width="6" stroke-linecap="round"/>
  <text class="ink sub" x="226" y="38">Agent: runs in your session</text>

  <path class="blue" d="M70 120 H300" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path class="green" d="M300 120 H890" stroke-width="10" stroke-linecap="round" fill="none"/>

  <rect class="surface inkstroke" x="57" y="107" width="26" height="26" rx="7" stroke-width="5"/>
  <text class="ink name mono" x="70" y="164" text-anchor="middle">ideation</text>
  <text class="muted sub" x="70" y="182" text-anchor="middle">pitch, you approve</text>

  <rect class="surface inkstroke" x="187" y="107" width="26" height="26" rx="7" stroke-width="5"/>
  <text class="ink name mono" x="200" y="164" text-anchor="middle">brief</text>
  <text class="muted sub" x="200" y="182" text-anchor="middle">BRIEF.md, you approve</text>

  <circle class="surface green" cx="360" cy="120" r="11" stroke-width="5"/>
  <text class="ink name mono" x="360" y="164" text-anchor="middle">creative-loop</text>
  <text class="muted sub" x="360" y="182" text-anchor="middle">run branch, scaffold, LOOP.md</text>

  <circle class="surface green" cx="560" cy="120" r="11" stroke-width="5"/>
  <text class="ink name" x="560" y="164" text-anchor="middle">Inner loop</text>
  <text class="muted sub" x="560" y="182" text-anchor="middle">edit, shot, look, check, commit</text>

  <circle class="surface green" cx="890" cy="120" r="11" stroke-width="5"/>
  <text class="ink name mono" x="890" y="164" text-anchor="middle">hand-off</text>
  <text class="muted sub" x="890" y="182" text-anchor="middle">video, sheet, summary</text>

  <path class="green" d="M720 120 C720 250 480 250 480 120" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  <text class="ink name" x="600" y="262" text-anchor="middle">Outer loop: the Stop hook</text>
  <text class="muted sub" x="600" y="282" text-anchor="middle">budget left: next direction, or a review cycle</text>
  <text class="muted sub" x="600" y="300" text-anchor="middle">budget spent: lets the agent stop</text>
  <text class="muted sub" x="725" y="108" text-anchor="middle">budget spent</text>
</svg>
